<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FitnessBud - Login/Register</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Custom background gradient */
        body {
            background: linear-gradient(135deg, #1f2937, #111827);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Inter', sans-serif;
        }
    </style>
</head>
<body>
    <div class="w-full max-w-4xl p-8 space-y-8 bg-gray-800 rounded-xl shadow-2xl">
        <header class="text-center">
            <h1 class="text-4xl font-extrabold text-blue-400">FitnessBud</h1>
            <p class="text-gray-400 mt-2">AI-Powered Workout Planner</p>
        </header>

        <!-- Error Message Display -->
        {% if error %}
        <div class="bg-red-900 border border-red-700 text-red-300 p-4 rounded-lg font-medium text-sm transition duration-300 transform hover:scale-[1.01]" role="alert">
            {{ error }}
        </div>
        {% endif %}

        <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
            <!-- Login Form -->
            <div class="p-6 bg-gray-700 rounded-xl shadow-lg border border-gray-600">
                <h2 class="text-2xl font-bold text-gray-100 mb-6 border-b border-gray-600 pb-3">Sign In</h2>
                <form action="/v1/auth/login" method="post" class="space-y-4">
                    <div>
                        <label for="login-username" class="block text-sm font-medium text-gray-400 mb-1">Email Address</label>
                        <input type="email" id="login-username" name="username" required
                               class="w-full px-4 py-2 bg-gray-800 border border-gray-600 rounded-lg text-gray-200 focus:ring-blue-500 focus:border-blue-500 transition duration-150">
                    </div>
                    <div>
                        <label for="login-password" class="block text-sm font-medium text-gray-400 mb-1">Password</label>
                        <input type="password" id="login-password" name="password" required
                               class="w-full px-4 py-2 bg-gray-800 border border-gray-600 rounded-lg text-gray-200 focus:ring-blue-500 focus:border-blue-500 transition duration-150">
                    </div>
                    <button type="submit"
                            class="w-full py-2.5 mt-4 bg-blue-600 text-white font-semibold rounded-lg hover:bg-blue-700 focus:outline-none focus:ring-4 focus:ring-blue-500 focus:ring-opacity-50 transition duration-300 transform hover:scale-[1.01]">
                        Login
                    </button>
                </form>
            </div>

            <!-- Registration Form -->
            <div class="p-6 bg-gray-700 rounded-xl shadow-lg border border-gray-600">
                <h2 class="text-2xl font-bold text-gray-100 mb-6 border-b border-gray-600 pb-3">New User? Register</h2>
                <form action="/v1/auth/register" method="post" class="space-y-4">
                    <div>
                        <label for="register-email" class="block text-sm font-medium text-gray-400 mb-1">Email Address</label>
                        <input type="email" id="register-email" name="email" required
                               class="w-full px-4 py-2 bg-gray-800 border border-gray-600 rounded-lg text-gray-200 focus:ring-green-500 focus:border-green-500 transition duration-150">
                    </div>
                    <div>
                        <label for="register-password" class="block text-sm font-medium text-gray-400 mb-1">Password</label>
                        <input type="password" id="register-password" name="password" required
                               class="w-full px-4 py-2 bg-gray-800 border border-gray-600 rounded-lg text-gray-200 focus:ring-green-500 focus:border-green-500 transition duration-150">
                        <p class="text-xs text-gray-500 mt-1">Note: Temporary profile data will be set on registration.</p>
                    </div>
                    <button type="submit"
                            class="w-full py-2.5 mt-4 bg-green-600 text-white font-semibold rounded-lg hover:bg-green-700 focus:outline-none focus:ring-4 focus:ring-green-500 focus:ring-opacity-50 transition duration-300 transform hover:scale-[1.01]">
                        Register
                    </button>
                </form>
            </div>
        </div>

        <footer class="text-center pt-4 text-gray-500 text-xs">
            &copy; 2023 FitnessBud. All rights reserved.
        </footer>
    </div>
</body>
</html>
