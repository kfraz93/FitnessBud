name: Python Testing & Coverage

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          # This automatically handles python-version from pyproject.toml
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run Tests with Coverage
        run: |
          # We use 'uv run' to ensure we are in the virtual environment
          uv run pytest --cov=domain --cov=infrastructure --cov-report=xml

      - name: Upload Coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: true